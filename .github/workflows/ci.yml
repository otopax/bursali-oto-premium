name: Enterprise CI Pipeline (Faz 3)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-security:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Lint
      run: npm run lint
      continue-on-error: true # Geçici olarak fail etmesin
      
    - name: Unit & Integration Tests (Vitest)
      run: npm run test -- --run
      
    - name: End-to-End Tests (Playwright)
      run: |
        npx playwright install --with-deps
        npm run test:e2e
        
    - name: Build
      run: npm run build
      
    - name: Security Scan - npm audit
      run: npm audit --audit-level=high
      continue-on-error: true
      
    # Supply Chain Security: SBOM Generation
    - name: Generate SBOM (CycloneDX)
      run: |
        npm install -g @cyclonedx/cyclonedx-npm
        cyclonedx-npm --output-format JSON --output-file sbom.json
        
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.json
        
    # Trivy Container & FS Security Scan
    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    # Send Trivy SARIF results to GitHub Advanced Security / DefectDojo
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
